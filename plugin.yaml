# OWASP CRS Plugin Descriptor
# https://github.com/coreruleset/plugin-registry

schema_version: 1

plugin:
  name: "cpanel-rule-exclusions-plugin"
  description: "CRS rule exclusions for cPanel web hosting control panel"
  long_description: |
    Provides targeted rule exclusions to eliminate false positives when
    running OWASP CRS in front of cPanel/WHM. Currently removes CRS rules
    920280 and 920350 for WHM's periodic internal /whm-server-status health
    checks from localhost.
  type: "official"
  category: "rule-exclusion"
  status: "tested"
  license: "Apache-2.0"
  authors:
    - name: "OWASP CRS Team"
      url: "https://coreruleset.org"
  repository: "https://github.com/coreruleset/cpanel-rule-exclusions-plugin"
  keywords:
    - "cpanel"
    - "whm"
    - "web-hosting"
    - "rule-exclusion"
    - "false-positive"

rule_id_range:
  start: 9510000
  end: 9510999

compatibility:
  crs_version: ">=4.0.0"

configuration:
  file: "plugins/cpanel-rule-exclusions-config.conf"
  variables:
    - name: "tx.cpanel-rule-exclusions-plugin_enabled"
      type: "boolean"
      default: 1
      description: "Enable or disable cPanel rule exclusions (0 to disable)"
